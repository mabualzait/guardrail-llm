[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-llm"
version = "0.1.0"
description = "Lightweight, zero-bloat LLM guardrails reverse proxy and Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Malik Abualzait", email = "m.abualzait@gmail.com" }]
keywords = ["llm", "guardrails", "proxy", "pii", "schema", "rate-limiting", "ollama", "vllm", "openai", "malik-abualzait"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
guardrail = "guardrail.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrail*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
